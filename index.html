<!doctype html>
<html lang="en">
    <head>
        <title>3D Model Viewer</title>
        <meta charset="UTF-8" />
        <meta property="og:description" content=" " />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <base href />
        <link rel="icon" href="data:," />
        <link rel="stylesheet" href="viewer.css?v=73" />
        <script>
            const params = new URLSearchParams(window.location.search)
            const currentV = params.get('v')
            if (!currentV) {
                const now = Date.now()
                const url = new URL(window.location.href)
                url.searchParams.set('v', now)
                window.location.replace(url.toString())
            } else {
                const stored = sessionStorage.getItem('page-v')
                const now = Date.now()
                if (!stored) {
                    sessionStorage.setItem('page-v', currentV)
                } else if (now - parseInt(currentV) > 60000) {
                    const url = new URL(window.location.href)
                    url.searchParams.set('v', now)
                    sessionStorage.setItem('page-v', now)
                    window.location.replace(url.toString())
                }
            }
        </script>
    </head>
    <body>
        <canvas id="application-canvas"></canvas>
        <div id="ui">
            <div id="poster"></div>
            <div id="loadingWrap">
                <div id="fileSizeInfo"></div>
                <div id="loadingText"></div>
                <div id="loadingBar"></div>
            </div>
            <div id="loading-overlay">
                <div class="spinner"></div>
            </div>
        </div>
        <div id="tooltip"></div>
    </body>

                        pitch: 0,

                    },
                },
                setupStep: 3,
                cameras: [{ x: -47.6024, y: -146.8633, alt: 1.1631 }],
            },
        }
    </script>
    <script src="./viewer.js?v=73"></script>
</html>
