<!doctype html>
<html lang="en">
    <head>
        <title>3D Model Viewer</title>
        <meta charset="UTF-8" />
        <meta property="og:description" content=" " />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <base href />
        <link rel="icon" href="data:," />
        <link rel="stylesheet" href="./data/viewer.css?v=3" />
        <link rel="preload" href="./data/viewer.js?v=3" as="script" />
        <script>
            const params = new URLSearchParams(window.location.search)
            const currentV = params.get('v')
            if (!currentV) {
                const now = Date.now()
                const url = new URL(window.location.href)
                url.searchParams.set('v', now)
                window.location.replace(url.toString())
            } else {
                const stored = sessionStorage.getItem('page-v')
                const now = Date.now()
                if (!stored) {
                    sessionStorage.setItem('page-v', currentV)
                } else if (now - parseInt(currentV) > 60000) {
                    const url = new URL(window.location.href)
                    url.searchParams.set('v', now)
                    sessionStorage.setItem('page-v', now)
                    window.location.replace(url.toString())
                }
            }
        </script>
    </head>
    <body>
        <canvas id="application-canvas"></canvas>
        <div id="ui">
            <div id="poster"></div>
        </div>
        <div id="tooltip"></div>
        <div id="spinnerWrap">
            <svg class="progress-ring" viewBox="0 0 200 200">
                <circle class="progress-ring-bg" cx="100" cy="100" r="86" fill="none" />
                <circle
                    id="progressRingFg"
                    class="progress-ring-fg"
                    cx="100"
                    cy="100"
                    r="86"
                    fill="none"
                    stroke-dasharray="540.35"
                    stroke-dashoffset="540.35" />
            </svg>
            <span id="spinnerPercent" class="spinner-percent">0%</span>
        </div>
    </body>
    <script>
        window.sse = {
            settings: {
                ref: '',
                model: 'spherical',
                contentUrl: 'canon.ply',
                v: 3,
                dimensions: {
                    boxColor: '#f95f4d',
                    background: { color: '#ffffff', alpha: 0.8 },
                    foregroundColor: '#f95f4d',
                    realSize: { x: 0, y: 0, z: 0 },
                    unit: 'cm',
                    type: 'dimensions',
                    position: { x: -0.19886479590887438, y: -11.556857006624337, z: 0.8511692670931625 },
                    size: { x: 23.025567005789917, y: 23.222788061946627, z: 21.83264811305908 },
                    rotation: { x: 180, y: 13.100000000000007, z: 180 },
                },
                setupStep: 4,
                chunkCount: 30,
            },
        }
    </script>
    <script src="./data/chunk.js?v=3"></script>
</html>
