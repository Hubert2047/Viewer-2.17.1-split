<!doctype html>
<html lang="en">
    <head>
        <title>3D Model Viewer</title>
        <meta charset="UTF-8" />
        <meta property="og:description" content=" " />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <base href />
        <link rel="icon" href="data:," />
        <link rel="stylesheet" href="./data/viewer.css?v=4" />
        <link rel="preload" href="./data/viewer.js?v=4" as="script" />
        <script>
            const params = new URLSearchParams(window.location.search)
            const currentV = params.get('v')
            if (!currentV) {
                const now = Date.now()
                const url = new URL(window.location.href)
                url.searchParams.set('v', now)
                window.location.replace(url.toString())
            } else {
                const stored = sessionStorage.getItem('page-v')
                const now = Date.now()
                if (!stored) {
                    sessionStorage.setItem('page-v', currentV)
                } else if (now - parseInt(currentV) > 60000) {
                    const url = new URL(window.location.href)
                    url.searchParams.set('v', now)
                    sessionStorage.setItem('page-v', now)
                    window.location.replace(url.toString())
                }
            }
        </script>
    </head>
    <body>
        <canvas id="application-canvas"></canvas>
        <div id="ui">
            <div id="poster"></div>
        </div>
        <div id="tooltip"></div>
        <div id="spinnerWrap">
            <svg class="progress-ring" viewBox="0 0 200 200">
                <circle class="progress-ring-bg" cx="100" cy="100" r="86" fill="none" />
                <circle
                    id="progressRingFg"
                    class="progress-ring-fg"
                    cx="100"
                    cy="100"
                    r="86"
                    fill="none"
                    stroke-dasharray="540.35"
                    stroke-dashoffset="540.35" />
            </svg>
            <span id="spinnerPercent" class="spinner-percent">0%</span>
        </div>
    </body>
    <script>
        window.sse = {
            settings: {
                ref: '',
                model: 'spherical',
                contentUrl: 'canon.ply',
                v: 4,
                dimensions: {
                    boxColor: '#f95f4d',
                    background: { color: '#ffffff', alpha: 0.8 },
                    foregroundColor: '#f95f4d',
                    realSize: { x: 12, y: 12.0015853433064, z: 11.90946683674146 },
                    unit: 'cm',
                    type: 'dimensions',
                    position: { x: -0.09417921207917379, y: -11.556857006624346, z: 2.568361833583797 },
                    size: { x: 23.219720459579367, y: 23.222788061946623, z: 23.044540897647302 },
                    rotation: { x: -179.99999999999997, y: 44.6599999999999, z: 179.99999999999997 },
                },
                measurement: {
                    lineColor: '#f95f4d',
                    textColor: '#ffffff',
                    textBackground: { color: '#000000', alpha: 0.8 },
                    calibration: { useDimensionData: true, unit: 'cm', distance: 0, points: [] },
                },
                setupStep: 4,
                chunkCount: 30,
            },
        }
    </script>
    <script src="./data/viewer.js?v=4"></script>
</html>
