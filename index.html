<!doctype html>
<html lang="en">
    <head>
        <title>3D Model Viewer</title>
        <meta charset="UTF-8" />
        <meta property="og:description" content=" " />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <base href />
        <link rel="icon" href="data:," />
        <link rel="stylesheet" href="./data/viewer.css?v=8" />
        <script>
            const params = new URLSearchParams(window.location.search)
            const currentV = params.get('v')
            if (!currentV) {
                const now = Date.now()
                const url = new URL(window.location.href)
                url.searchParams.set('v', now)
                window.location.replace(url.toString())
            } else {
                const stored = sessionStorage.getItem('page-v')
                const now = Date.now()
                if (!stored) {
                    sessionStorage.setItem('page-v', currentV)
                } else if (now - parseInt(currentV) > 60000) {
                    const url = new URL(window.location.href)
                    url.searchParams.set('v', now)
                    sessionStorage.setItem('page-v', now)
                    window.location.replace(url.toString())
                }
            }
        </script>
    </head>
    <body>
        <canvas id="application-canvas"></canvas>
        <div id="ui">
            <div id="poster"></div>
        </div>
        <div id="tooltip"></div>
        <div id="spinnerWrap">
            <svg class="progress-ring" viewBox="0 0 200 200">
                <circle class="progress-ring-bg" cx="100" cy="100" r="86" fill="none" />
                <circle
                    id="progressRingFg"
                    class="progress-ring-fg"
                    cx="100"
                    cy="100"
                    r="86"
                    fill="none"
                    stroke-dasharray="540.35"
                    stroke-dashoffset="540.35" />
            </svg>
            <span id="spinnerPercent" class="spinner-percent">0%</span>
        </div>
    </body>
    <script>
        window.sse = {
            settings: {
                ref: '',
                model: 'cylindrical',
                contentUrl: 'models/noise.ply',
                v: 8,
                chunkCount: 0,
            },
        }
    </script>
    <script src="./data/viewer.js?v=8"></script>
</html>
